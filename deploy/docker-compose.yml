services:
  mongodb:
    image: mongo:8.0
    container_name: company-instrument-mongodb
    restart: unless-stopped

    command:
      - mongod
      - --replSet
      - rs0
      - --bind_ip_all

    ports:
      - "27017:27017"

    volumes:
      - mongodb_data:/data/db

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --eval \"db.adminCommand('ping').ok\" | grep 1"
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  mongodb-init:
    image: mongo:8.0
    container_name: company-instrument-mongodb-init
    depends_on:
      mongodb:
        condition: service_healthy
    restart: "no"

    command:
      - mongosh
      - --host
      - mongodb:27017
      - --eval
      - |
        try {
          rs.status();
          print("Replica set already initialized");
        } catch (e) {
          print("Initializing replica set...");
          rs.initiate({
            _id: "rs0",
            members: [
              {
                _id: 0,
                host: "localhost:27017"
              }
            ]
          });
        }

volumes:
  mongodb_data: